spring:
  application:
    name: trade-capture-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trades}
    username: ${DATABASE_USER:trades}
    password: ${DATABASE_PASSWORD:trades}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: trade-capture-api
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.capitalmarkets.trade.application.TradeRecord
        spring.json.trusted.packages: com.capitalmarkets.trade.application
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONCURRENCY:3}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false
app:
  kafka:
    topic: trades.intraday
  security:
    allowed-origin: ${UI_ORIGIN:http://localhost:4200}
logging:
  level:
    com.capitalmarkets.trade: INFO
