name: trade-capture-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trades}
      POSTGRES_USER: ${POSTGRES_USER:-trades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trades}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_TRADE_PARTITIONS:-3}
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trades}
      DATABASE_USER: ${POSTGRES_USER:-trades}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-trades}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-trade-capture-api}
      KAFKA_CONCURRENCY: ${KAFKA_CONCURRENCY:-3}
      TRADE_WRITE_BATCH_SIZE: ${TRADE_WRITE_BATCH_SIZE:-1000}
      TRADE_MAX_CSV_ROWS: ${TRADE_MAX_CSV_ROWS:-1000000}
      TRADE_MAX_FILE_SIZE: ${TRADE_MAX_FILE_SIZE:-25MB}
      TRADE_MAX_REQUEST_SIZE: ${TRADE_MAX_REQUEST_SIZE:-26MB}
      KAFKA_TRADE_TOPIC: ${KAFKA_TRADE_TOPIC:-trades.intraday}
      KAFKA_TRADE_PARTITIONS: ${KAFKA_TRADE_PARTITIONS:-3}
      KAFKA_TRADE_REPLICAS: ${KAFKA_TRADE_REPLICAS:-1}
      KAFKA_DLT_SUFFIX: ${KAFKA_DLT_SUFFIX:-.DLT}
      KAFKA_PUBLISH_TIMEOUT: ${KAFKA_PUBLISH_TIMEOUT:-10s}
      KAFKA_RETRY_BACKOFF: ${KAFKA_RETRY_BACKOFF:-1s}
      KAFKA_RETRY_ATTEMPTS: ${KAFKA_RETRY_ATTEMPTS:-3}
      UI_ORIGIN: http://localhost:4200
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  ui:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${UI_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seed-demo:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres-data:
  kafka-data:
